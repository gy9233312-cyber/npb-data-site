<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロ野球データ</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    nav {
      background: white;
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #eee;
    }
  </style>
</head>

<body>

<header>
  <h1>⚾ プロ野球データ</h1>
  <p>NPB選手・チーム成績データ</p>
</header>

<nav>
  <a href="#">ホーム</a>
  <a href="#">選手</a>
  <a href="#">チーム</a>
  <a href="#">ランキング</a>
</nav>

<main>

  <div class="card">
    <h2>今日のプロ野球</h2>
    <p>試合情報をここに表示します。</p>
  </div>

  <div class="card">
    <h2>セ・リーグ順位表</h2>

    <table>
      <tr>
        <th>順位</th>
        <th>チーム</th>
        <th>勝</th>
        <th>敗</th>
        <th>勝率</th>
      </tr>

      <tr>
        <td>1</td>
        <td>巨人</td>
        <td>0</td>
        <td>0</td>
        <td>---</td>
      </tr>

      <tr>
        <td>2</td>
        <td>阪神</td>
        <td>0</td>
        <td>0</td>
        <td>---</td>
      </tr>

      <tr>
        <td>3</td>
        <td>DeNA</td>
        <td>0</td>
        <td>0</td>
        <td>---</td>
      </tr>
    </table>
  </div>

  <div class="card">
    <h2>打撃ランキング</h2>

    <table>
      <tr>
        <th>選手</th>
        <th>チーム</th>
        <th>打率</th>
        <th>本塁打</th>
        <th>OPS</th>
      </tr>

      <tr>
        <td>選手A</td>
        <td>巨人</td>
        <td>.000</td>
        <td>0</td>
        <td>.000</td>
      </tr>

      <tr>
        <td>選手B</td>
        <td>阪神</td>
        <td>.000</td>
        <td>0</td>
        <td>.000</td>
      </tr>
    </table>
  </div>

</main>

</body>
</html>
